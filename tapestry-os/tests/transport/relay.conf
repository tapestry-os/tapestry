# relay.conf — build the two-hop opportunistic relay variant.
#
#   west build -b native_sim/native/64 \
#       --build-dir tapestry/tapestry-os/build/test-transport-relay \
#       --extra-conf relay.conf \
#       tapestry/tapestry-os/tests/transport
#
# The overlay is named without a path: EXTRA_CONF_FILE is resolved
# relative to the application source directory, not the working
# directory, so a workspace-relative path would be appended to the app
# dir and not found.
#
# CONFIG_TAPESTRY_MESH_RELAY compiles in the relay ring buffer, the
# per-origin last-relayed clock table and the jittered flush timer, and
# raises first-party hop_count from 0 to 2.  The jitter draws from
# sys_rand32_get(), which needs a random generator selected; the test
# generator is chosen rather than an entropy device so this overlay works
# on any board, not just ones with an RNG peripheral.  Relay timing is
# never security-relevant — it only spreads re-advertisements to reduce
# collisions.
CONFIG_ZTEST=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TAPESTRY_MESH_RELAY=y
