# auth.conf — build the authenticated-framing variant.
#
#   west build -b native_sim/native/64 \
#       --build-dir tapestry/tapestry-os/build/test-transport-auth \
#       --extra-conf auth.conf \
#       tapestry/tapestry-os/tests/transport
#
# The overlay is named without a path: EXTRA_CONF_FILE is resolved
# relative to the application source directory, not the working
# directory, so a workspace-relative path would be appended to the app
# dir and not found.
#
# CONFIG_TAPESTRY_WIRE_AUTH_ENABLED appends a 4-byte truncated HMAC-SHA256
# tag to every frame and verifies it on receipt (gossip.c).  gossip.c
# computes that tag with psa_mac_compute(), so what has to be configured is
# the PSA algorithm and key type — NOT the legacy MBEDTLS_MD_C layer, which
# in Mbed TLS 4.x is both private API and, when pulled in here, fails
# Zephyr's -Werror build on unused parameters in its own extras/md.c.
CONFIG_ZTEST=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# psa_crypto_init() seeds a CSPRNG, which needs an entropy source.
# native_sim provides one via its rng devicetree node.
CONFIG_ENTROPY_GENERATOR=y

CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

CONFIG_TAPESTRY_WIRE_AUTH_ENABLED=y
CONFIG_TAPESTRY_WIRE_AUTH_KEY="tapestry-ci-test-key"
