# Board overlay for the Ambiq Apollo330M Plus EVB (Apollo330P / Cortex-M55)
#
# Unlike the Apollo510 EVB this part has an on-die BLE controller reached over
# an HCI IPC channel (zephyr,bt-hci = &bt_hci_ipc0 in the board DTS), so it can
# gossip over BLE, over the wired serial bus, or both at once.  Both are
# enabled here: the wired bus pairs it with the Apollo510 EVB, and BLE pairs it
# with any Tapestry BLE element (micro:bit, ESP32).
#
# This board lives in Ambiq's Zephyr distribution, not upstream Zephyr — see
# tapestry-os/boards/apollo330mP_evb/README.md for the workspace.
#
# Build (from the workspace root):
#   west build -b apollo330mP_evb \
#       --build-dir tapestry/tapestry-scr-hw/build/ap330-e1 \
#       tapestry/tapestry-scr-hw -- -DCONFIG_TAPESTRY_ELEMENT_ID=1

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── Gossip transport: wired serial bus ────────────────────────────────────────
# UART1 is brought up as the bus by the Tapestry overlay, which also sets the
# tapestry,gossip-uart chosen node the transceiver reads.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_TAPESTRY_TRANSCEIVER_UART=y

# ── Gossip transport: BLE ─────────────────────────────────────────────────────
# transceiver_ble.c registers alongside the wired bus; gossip_drain merges
# frames from both.  Comment this block out for a wired-only element.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
# Peers on current main (micro:bit, ESP32) advertise the gossip frame with
# extended advertising; the scanner only receives those reports with this on.
CONFIG_BT_EXT_ADV=y
# Two advertising sets: state gossip and shared facts (transceiver_ble.c).
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_DEVICE_NAME="tapestry-ap330"
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── Hardware identity ─────────────────────────────────────────────────────────
CONFIG_HWINFO=y

# ── GPIO (LEDs + buttons for the L1 substrate) ────────────────────────────────
CONFIG_GPIO=y

# ── Element identity ──────────────────────────────────────────────────────────
# Override at build time with: -- -DCONFIG_TAPESTRY_ELEMENT_ID=N
# Defaults to 1 so it pairs with the Apollo510 EVB's default of 0.
CONFIG_TAPESTRY_ELEMENT_ID=1
