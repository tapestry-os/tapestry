# Board overlay for the Ambiq Apollo510 EVB (Apollo510 / Cortex-M55)
# Radio-less swarm element: gossip over a wired serial bus, status on the
# three on-board LEDs, telemetry as METRIC CSV lines over the UART0 console.
#
# Build (from the workspace root):
#   west build -b apollo510_evb \
#       --build-dir tapestry/tapestry-scr-hw/build/ap510-e0 \
#       tapestry/tapestry-scr-hw -- -DCONFIG_TAPESTRY_ELEMENT_ID=0
#   west flash --build-dir tapestry/tapestry-scr-hw/build/ap510-e0
#
# Console: UART0, 115200 8N1, on the EVB's J-Link USB VCOM port.
#   minicom -D /dev/ttyACM0 -b 115200
#
# See tapestry-os/boards/apollo510_evb/README.md for bus wiring.

# ── Floating point ────────────────────────────────────────────────────────────
# The apollo5x SoC Kconfig selects CPU_HAS_FPU but does not turn CONFIG_FPU on.
# FPU_SHARING saves/restores FPU registers on context switches — required
# because float-touching code runs in main, the system workqueue, and the
# gossip stats work handler.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── Gossip transport: wired serial bus ────────────────────────────────────────
# The Apollo510 has no radio on-die, so elements gossip over a shared UART
# bus.  UART2 is brought up as that bus by the Tapestry overlay
# (tapestry-os/boards/apollo510_evb/apollo510_evb.overlay), which also sets
# the `tapestry,gossip-uart` chosen node the transceiver reads.
#
# CONFIG_UART_INTERRUPT_DRIVEN is already set by the board's own defconfig.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_TAPESTRY_TRANSCEIVER_UART=y

# ── Hardware identity ─────────────────────────────────────────────────────────
# Feeds the auto-ID nonce (CHIPID0/CHIPID1/trim revision via hwinfo_ambiq).
# Not required by this element — it takes its ID from Kconfig below — but
# cheap, and applications that call transport_negotiate_id() need it.
CONFIG_HWINFO=y

# ── GPIO (LEDs + buttons for the L1 substrate) ────────────────────────────────
CONFIG_GPIO=y

# ── Element identity ──────────────────────────────────────────────────────────
# Override at build time with: -- -DCONFIG_TAPESTRY_ELEMENT_ID=N
CONFIG_TAPESTRY_ELEMENT_ID=0

# ── Power management ──────────────────────────────────────────────────────────
# The board defconfig enables CONFIG_PM / PM_DEVICE / PM_DEVICE_RUNTIME and the
# SoC devicetree offers suspend-to-idle and suspend-to-ram.  Left on, and
# CONFIRMED on hardware 2026-08-25: transceiver_uart.c takes a pm_policy lock on
# PM_STATE_SUSPEND_TO_RAM at init so the gossip UART keeps its clock between
# cycles, while the shallower idle state stays available.  Loopback gossip runs
# clean with PM enabled — no special build flag is needed.
#
# If gossip RX ever goes lossy on a larger bus, CONFIG_PM=n is still the first
# bisect: it rules the policy lock in or out in one build.
