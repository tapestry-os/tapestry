# Board overlay for ESP-WROVER-KIT (ESP32 / Xtensa LX6)
# Element 0 in the Phase 2 swarm.
#
# BLE gossip dropped from this board: the gossip frame (wire.h v3, 42 bytes)
# requires LE Extended Advertising (CONFIG_BT_EXT_ADV, Bluetooth 5.0+), and
# this chip's Bluetooth controller is 4.2-only — Espressif's HAL declares
# SOC_BLE_50_SUPPORTED for esp32c2/c3/c5/c6/h2/c61/s3 but not the plain
# esp32 (ESP32-D0WD-V3, this board's module). See transceiver_ble.c's
# header comment. This board still gossips over WiFi/UDP, its other
# configured transport (to RA8D1) — dropping BLE loses only the BLE leg's
# redundancy with micro:bit-based elements, not gossip capability itself.

# ── ESP32 chip revision workaround ────────────────────────────────────────────
CONFIG_ESP32_USE_UNSUPPORTED_REVISION=y

# ── Networking (shared with RA8D1 overlay) ────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=n
CONFIG_NET_STATISTICS=n
CONFIG_NET_LOG=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# ── WiFi ──────────────────────────────────────────────────────────────────────
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI_INIT_PRIORITY=80

# ── Element identity ──────────────────────────────────────────────────────────
CONFIG_TAPESTRY_ELEMENT_ID=0

# WiFi credentials are NOT stored here — supply them via a gitignored file:
#
#   cp tapestry/tapestry-scr-hw/wifi.conf.example \
#      tapestry/tapestry-scr-hw/wifi.conf
#   # edit wifi.conf, then:
#   west build -b esp_wrover_kit/esp32/procpu \
#       --extra-conf tapestry/tapestry-scr-hw/wifi.conf \
#       tapestry/tapestry-scr-hw
