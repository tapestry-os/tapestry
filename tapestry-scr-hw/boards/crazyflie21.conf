# Board overlay for Bitcraze Crazyflie 2.1 brushless (STM32F405 / Cortex-M4F)
# BLE swarm element with brushless ESC output via TIM2 PWM.
#
# Build:
#   west build -b crazyflie21 tapestry/tapestry-scr-hw
#
# The Crazyflie 2.1 has an nRF51822 radio co-processor connected over UART.
# Full BLE gossip transport requires a UART-to-BLE bridge driver; that work
# is deferred until the board DTS is finalised.  The transport stubs compile
# and link cleanly; gossip simply produces no packets until the bridge lands.

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── PWM (brushless motor ESCs via TIM2) ───────────────────────────────────────
CONFIG_PWM=y

# ── Bluetooth (nRF51822 co-processor via USART6 HCI) ─────────────────────────
#
# PREREQUISITE: reflash the nRF51822 with HCI firmware before enabling.
# The factory radio firmware is not HCI-compatible.
#
# Once nRF51 runs HCI firmware, uncomment all lines below and rebuild.
# The USART6 node (PC6/PC7, 1 Mbps) is already enabled in the overlay.
#
# CONFIG_BT=y
# CONFIG_BT_HCI_UART=y
# CONFIG_BT_OBSERVER=y
# CONFIG_BT_BROADCASTER=y
# CONFIG_BT_DEVICE_NAME="tapestry-cf21"
# CONFIG_BT_RX_STACK_SIZE=4096
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── Element identity ──────────────────────────────────────────────────────────
# Override at build time with: -- -DCONFIG_TAPESTRY_ELEMENT_ID=N
CONFIG_TAPESTRY_ELEMENT_ID=0
