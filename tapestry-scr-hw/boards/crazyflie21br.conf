# Board overlay for Bitcraze Crazyflie 2.1 brushless (STM32F405 / Cortex-M4F)
# BLE swarm element with brushless ESC output via TIM2 PWM.
#
# Build:
#   west build -b crazyflie21br tapestry/tapestry-scr-hw -- -DCONFIG_PWM=n
#
# Console: USART3 on PC10 (TX) / PC11 (RX), 115200 baud.
# Connect a 3.3 V USB-serial adapter: white (RX) → PC10, green (TX) → PC11, GND.
# On Linux: minicom -D /dev/ttyUSB0 -b 115200

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y


# ── PWM (brushless motor ESCs via TIM2) ───────────────────────────────────────
CONFIG_PWM=y

# ── Bluetooth (nRF51822 co-processor via USART6 HCI) ─────────────────────────
#
# PREREQUISITE: reflash the nRF51822 with HCI firmware before enabling.
# The factory radio firmware is not HCI-compatible.
#
# Once nRF51 runs HCI firmware, uncomment all lines below and rebuild.
# The USART6 node (PC6/PC7, 1 Mbps) is already enabled in the overlay.
#
# CONFIG_BT=y
# CONFIG_BT_HCI_UART=y
# CONFIG_BT_OBSERVER=y
# CONFIG_BT_BROADCASTER=y
# CONFIG_BT_DEVICE_NAME="tapestry-cf21"
# CONFIG_BT_RX_STACK_SIZE=4096
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── Element identity ──────────────────────────────────────────────────────────
# Override at build time with: -- -DCONFIG_TAPESTRY_ELEMENT_ID=N
CONFIG_TAPESTRY_ELEMENT_ID=0

# Logging — required for cf21_crtp_log.c to be compiled and activated.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# USB CDC ACM console: attempted, blocked by what looked like a PLL_Q clock
# issue. Likely same root cause as the APB1/USART3 baud mismatch — &clk_hse
# in the DTS assumed a 40 MHz TCXO, but the stock firmware (HSE_VALUE=8000000,
# PLL_M=8, HSEBYP cleared) implies an 8 MHz crystal. DTS now corrected to
# 8 MHz / div-m=8; revisit USB CDC once USART3 is confirmed working at the
# corrected clock.
