# Board overlay for BBC micro:bit V2 (nRF52833 / Cortex-M4F)
# BLE swarm element with Cutebot Mini motor and LED output.
#
# No networking stack — gossip travels over BLE advertising instead.
# Telemetry is emitted as METRIC CSV lines over USB serial (115200 baud).
#
# The nRF52833 has a hardware FPU but Zephyr does not enable it by default.
# FPU_SHARING saves/restores FPU registers on context switches.

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── Bluetooth ─────────────────────────────────────────────────────────────────
# CONFIG_BT_EXT_ADV: required since the gossip frame (wire.h v3, 42 bytes)
# no longer fits legacy advertising's 31-byte payload — see
# transceiver_ble.c's header comment.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y

# Controller advertising/scan BUFFERS are separate knobs from the
# extended-advertising feature itself and both default to 31 (the legacy
# payload size).  Left at the default, bt_le_ext_adv_set_data() fails -EDOM
# for every 48-byte wire.h v3 frame and no gossip is ever transmitted — the
# advertiser still starts cleanly, so the only symptom is that every element
# sees zero peers.  See examples/cutebot-formation/boards/bbc_microbit_v2.conf
# for the full write-up (2026-08-24).
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=64
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=64
CONFIG_BT_DEVICE_NAME="tapestry"
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── I2C (Cutebot) ─────────────────────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# ── Element identity ──────────────────────────────────────────────────────────
# Override at build time with: -- -DCONFIG_TAPESTRY_ELEMENT_ID=N
CONFIG_TAPESTRY_ELEMENT_ID=0
