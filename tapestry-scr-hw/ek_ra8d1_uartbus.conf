# Wired-gossip-bus variant for the Renesas EK-RA8D1.
#
# Overrides the board's default Ethernet/UDP transport (boards/ek_ra8d1.conf)
# so the RA8D1 gossips over a shared serial bus instead — letting it pair
# directly with the radio-less Apollo510 EVB with no host, no LAN, and no
# collector.  A genuinely heterogeneous swarm: Renesas Cortex-M85 talking to
# Ambiq Cortex-M55 over two wires.
#
# Build (from the workspace root):
#   west build -b ek_ra8d1 \
#       --build-dir tapestry/tapestry-scr-hw/build/ra8d1-e1 \
#       tapestry/tapestry-scr-hw \
#       --extra-conf ek_ra8d1_uartbus.conf
#
# The --extra-conf path is resolved relative to the APPLICATION directory
# (tapestry-scr-hw), not the shell CWD — hence the bare filename.
#
# Element ID comes from boards/ek_ra8d1.conf, which already sets 1 — pairing
# with the Apollo510's default of 0.
#
# EXPECTED: this build prints a handful of Kconfig warnings about NET_* symbols
# having unmet dependencies.  They come from the networking block in
# boards/ek_ra8d1.conf, which Zephyr merges before this file and which cannot
# be made conditional.  Harmless — the symbols below win.

# ── Networking OFF ────────────────────────────────────────────────────────────
# Not merely unused: net_connect() ends in k_sem_take(&ip_acquired, K_FOREVER),
# so with networking enabled and no DHCP lease the element blocks forever in
# transport_init() and never reaches its main loop.  It must be off for a
# cable-free bus test.
#
# Turning networking off also switches telemetry from UDP-to-collector back to
# METRIC CSV lines on the console, which is what we want on the bench — and
# matches what the Apollo510 prints.
CONFIG_NETWORKING=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_UDP=n
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_ARP=n

# ── Gossip transport: wired serial bus ────────────────────────────────────────
# UART3 (SCI3) is already enabled at 115200 by the stock board DTS; the
# Tapestry overlay only adds the tapestry,gossip-uart chosen node.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_TAPESTRY_TRANSCEIVER_UART=y

# ── Hardware identity ─────────────────────────────────────────────────────────
CONFIG_HWINFO=y
