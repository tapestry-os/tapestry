# Board overlay for Crazyflie 2.1 brushless (STM32F405 / Cortex-M4F)
# Running cf21bl_mix unit tests directly on hardware.
#
# The STM32F405 has an FPU; FPU_SHARING is required when more than one
# Zephyr thread uses floating-point registers (ztest uses a separate thread).
#
# Radio console: ztest PASS/FAIL output (printk) is routed through the Zephyr
# log subsystem (CONFIG_LOG_PRINTK) and forwarded by cf21bl_crtp_log.c over
# USART6 to the nRF51 co-processor.  crazyflie_console.py shows results on host.
# CONFIG_LOG_MODE_IMMEDIATE sends each message synchronously so output is
# never lost if the test binary crashes after a failure.

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
