# Board overlay for Crazyflie 2.1 brushless (STM32F405 / Cortex-M4F)
# Running cf21_mix unit tests directly on hardware.
#
# The STM32F405 has an FPU; FPU_SHARING is required when more than one
# Zephyr thread uses floating-point registers (ztest uses a separate thread).

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
