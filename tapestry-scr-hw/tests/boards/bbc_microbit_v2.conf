# Board overlay for BBC micro:bit V2 (nRF52833 / Cortex-M4F)
#
# The nRF52833 has an FPU but Zephyr does not enable it by default for this
# board.  cf21bl_mix() uses only basic arithmetic, but fabsf() in the test
# epsilon helper requires FPU_SHARING when more than one thread uses the FPU.

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ZTEST_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
