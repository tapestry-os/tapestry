name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# Deliberately no contents/pull-requests write here for the whole job —
# granted narrowly per-step below instead:
#   - GITHUB_TOKEN (auto-issued, this repo only) posts the PR comment/status.
#   - CLA_SIGNATURES_TOKEN (a separate secret, see README) is a fine-grained
#     PAT scoped ONLY to tapestry-os/cla-signatures, so a compromised or
#     leaked secret cannot touch this repo's code or any other repo.
permissions:
  actions: write
  statuses: write
  pull-requests: write

jobs:
  CLA:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # Pinned to the v2.6.1 release commit, not the mutable tag: the
        # upstream project (contributor-assistant/github-action, formerly
        # SAP's cla-assistant-lite) was archived 2026-03-23 and is no
        # longer maintained. This SHA is the last thing anyone reviewed;
        # nothing will move under it without this line changing.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/tapestry-os/tapestry/blob/main/CLA.md'
          remote-organization-name: 'tapestry-os'
          remote-repository-name: 'cla-signatures'
          branch: 'main'
          allowlist: dependabot[bot]
