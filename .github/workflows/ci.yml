name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch so a fast-follow push
# doesn't queue behind a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python surface: the Choreographer SDK (sdk/python/tapestry), the
  # script compiler and the replay/simulation harness (sdk/tools).  This is
  # the layer a domain expert edits — a .choreo.toml and nothing else — so
  # it gets a real test suite rather than only the two --check gates below.
  #
  # Deliberately first and deliberately cheap: no Zephyr, no toolchain, no
  # west workspace.  A broken script parser or a mis-emitted C header is
  # caught in seconds instead of after a full firmware build.
  python:
    name: Python SDK and tools
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: script_toml.py parses with tomllib, which
        # arrived in 3.11.  3.12 is what CONTRIBUTING.md asks contributors
        # to install.  Both are tested so the floor stays real.
        python-version: ['3.11', '3.12']

    defaults:
      run:
        working-directory: tapestry

    steps:
      # Checked out under tapestry/ like every other job: choreoc.py spells
      # its regenerate banners relative to the WORKSPACE root (the directory
      # holding tapestry/), and test_choreoc.py checks those banners resolve.
      # The default checkout path happens to produce the same layout for a
      # repository named "tapestry" — saying it explicitly means a fork or a
      # rename cannot quietly break header discovery.
      - name: Checkout Tapestry
        uses: actions/checkout@v7
        with:
          path: tapestry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # pytest and ruff only, and only here — the SDK and tools themselves
      # are standard library, so nothing installed in this job is needed to
      # build firmware, compile a Choreo script, or run choreo_sim.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest ruff

      # Narrow rule set (see sdk/pyproject.toml): pyflakes plus the bugbear
      # traps, no style rewriting.  A red run always means a real defect.
      #
      # --config is required, not cosmetic: the config lives in sdk/, and
      # without it every file OUTSIDE sdk/ would be linted with whatever
      # rules the installed ruff defaults to.  Those defaults widened
      # between 0.14 and 0.16, so an unpinned install here would disagree
      # with a set-up workspace (which gets 0.14.2 from Zephyr's
      # requirements) over files nobody touched.
      - name: Lint
        run: ruff check --config sdk/pyproject.toml .

      # Named explicitly rather than bare `pytest`: the pytest config lives
      # in sdk/pyproject.toml, and pytest only searches UPWARD for one, so
      # a bare invocation at the repository root would not read it.
      - name: Unit tests
        run: pytest sdk/tests

  ztests:
    name: Zephyr unit tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Tapestry
        uses: actions/checkout@v7
        with:
          path: tapestry

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Fails loudly if wire.h changed and the three Python protocol.py
      # mirrors weren't regenerated — the whole point of generating them
      # is that this can never silently drift.  Pure Python, no Zephyr
      # needed, so it runs before the expensive toolchain setup below.
      - name: Check wire protocol mirrors are up to date
        working-directory: ${{ github.workspace }}
        run: python3 tapestry/tapestry-os/tools/gen_wire_protocol.py --check

      # Same guarantee for Choreo scripts: every committed choreo_script.h
      # must match what its .choreo.toml generates today.  These headers are
      # committed so firmware builds never need Python, which also means a
      # script edit that isn't recompiled ships silently — and one already
      # did: examples/webots-formation's copy sat a release behind
      # examples/cf21bl-formation's, so the simulation ran a different
      # script than the hardware demo it claimed to mirror.  No arguments:
      # choreoc discovers every generated header and recovers its source
      # from its own banner, so a new example is covered without touching
      # this file.
      - name: Check Choreo script headers are up to date
        working-directory: ${{ github.workspace }}
        run: python3 tapestry/sdk/tools/choreoc.py --check

      # Sets up a west workspace at $GITHUB_WORKSPACE, installs the
      # Zephyr SDK, and exports ZEPHYR_BASE.  The app-path tells the
      # action where the west.yml manifest lives.
      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: tapestry
          toolchains: x86_64-zephyr-elf

      # ── L4 CSM ──────────────────────────────────────────────────────────

      - name: Build L4 unit tests
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-csm-sim/build/test-csm \
            tapestry/tapestry-csm-sim/tests

      - name: Run L4 unit tests
        working-directory: ${{ github.workspace }}
        run: ./tapestry/tapestry-csm-sim/build/test-csm/zephyr/zephyr.exe

      # ── L5 SCR ──────────────────────────────────────────────────────────

      - name: Build L5 unit tests
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-scr-sim/build/test-scr \
            tapestry/tapestry-scr-sim/tests

      - name: Run L5 unit tests
        working-directory: ${{ github.workspace }}
        run: ./tapestry/tapestry-scr-sim/build/test-scr/zephyr/zephyr.exe

      # ── cf21bl formation field + choreo script ──────────────────────────
      # Regression tests for the flight-found spring-field bugs (target
      # leash, alignment squeeze, solo glide, hold-on-stale) plus the
      # rotation/anchor invariants, and the L6/L7 choreo-script suite
      # (hold→exchange→bow swap end-to-end, suspension freeze, snapshot
      # wait, stall rejection).  Pure C — runs on native_sim.

      - name: Build formation-field + choreo unit tests
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/examples/cf21bl-formation/build/test-formation \
            tapestry/examples/cf21bl-formation/tests

      - name: Run formation-field + choreo unit tests
        working-directory: ${{ github.workspace }}
        run: ./tapestry/examples/cf21bl-formation/build/test-formation/zephyr/zephyr.exe

      # ── cutebot-formation formation field + choreo script ───────────────
      # Same shape as cf21bl-formation's suite above: demo_track_target()'s
      # go-to-point law (arrival snap, trapezoidal approach, the exact-180-
      # degree-behind reverse case, emergency repulsion) plus the
      # hold->form(grid)->hold script end-to-end, driven through real
      # demo_odometry_t integration rather than a teleporting perfect
      # tracker. Pure C — runs on native_sim. Written and standalone-host-
      # verified (plain clang against the real scr.c/bse.c/choreo.c/
      # world_model.c, no Zephyr) but never previously run through an
      # actual west/native_sim build — this is that first real run.

      - name: Build cutebot-formation formation-field + choreo unit tests
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/examples/cutebot-formation/build/test-formation \
            tapestry/examples/cutebot-formation/tests

      - name: Run cutebot-formation formation-field + choreo unit tests
        working-directory: ${{ github.workspace }}
        run: ./tapestry/examples/cutebot-formation/build/test-formation/zephyr/zephyr.exe

      # ── cf21bl motor mixing ─────────────────────────────────────────────
      # Existing ztest suite (uniform-reduction saturation, yaw signs);
      # previously only ever run on hardware — also pure C.

      - name: Build motor-mix unit tests
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-scr-hw/build/test-mix \
            tapestry/tapestry-scr-hw/tests

      - name: Run motor-mix unit tests
        working-directory: ${{ github.workspace }}
        run: ./tapestry/tapestry-scr-hw/build/test-mix/zephyr/zephyr.exe

      # ── L3 transport: gossip wire round-trip ────────────────────────────
      # The only tests that put real bytes through gossip_send/gossip_drain.
      # Everything else stubs the wire — the L6/L7 collective-achievement
      # tests write wm.entries[N].state.goal_achieved directly — so a field
      # that is packed but never unpacked used to reach flight unnoticed.
      #
      # Built three ways because the auth and relay code paths were, until
      # now, compiled by nothing at all: both default to n and no example,
      # test or CI job turned them on.  Compile-only would already have been
      # an improvement; the loopback transceiver means CI actually exercises
      # HMAC sign-and-verify and the two-hop relay queue.

      - name: Build transport tests — default framing
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-os/build/test-transport \
            tapestry/tapestry-os/tests/transport

      - name: Run transport tests — default framing
        working-directory: ${{ github.workspace }}
        run: ./tapestry/tapestry-os/build/test-transport/zephyr/zephyr.exe

      # --extra-conf takes a path relative to the APPLICATION source
      # directory (Zephyr resolves EXTRA_CONF_FILE against it, not against
      # the working directory), and these overlays live in the app dir — so
      # the argument is a bare filename, unlike the absolute /tmp path the
      # WiFi overlay uses in the hw-build job below.
      - name: Build transport tests — auth enabled
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-os/build/test-transport-auth \
            --extra-conf auth.conf \
            tapestry/tapestry-os/tests/transport

      - name: Run transport tests — auth enabled
        working-directory: ${{ github.workspace }}
        run: ./tapestry/tapestry-os/build/test-transport-auth/zephyr/zephyr.exe

      - name: Build transport tests — relay enabled
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-os/build/test-transport-relay \
            --extra-conf relay.conf \
            tapestry/tapestry-os/tests/transport

      - name: Run transport tests — relay enabled
        working-directory: ${{ github.workspace }}
        run: ./tapestry/tapestry-os/build/test-transport-relay/zephyr/zephyr.exe

      # ── Simulation elements (compile-only) ──────────────────────────────
      # These are not run in CI (they require the Python orchestrator)
      # but we verify they compile to catch regressions early.

      - name: Build L4 simulation element
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-csm-sim/build/element \
            tapestry/tapestry-csm-sim/zephyr/element

      - name: Build L5 simulation element
        working-directory: ${{ github.workspace }}
        run: |
          west build -b native_sim/native/64 \
            --build-dir tapestry/tapestry-scr-sim/build/element \
            tapestry/tapestry-scr-sim/zephyr/element

  # Compile the test suites for both Phase 1 hardware targets.
  # These builds are compile-only (no run): they verify that the pure C99
  # L4/L5 core compiles cleanly for Xtensa (ESP32) and Cortex-M85 (RA8D1).
  hw-build:
    name: Hardware target compile check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Tapestry
        uses: actions/checkout@v7
        with:
          path: tapestry

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: tapestry
          toolchains: xtensa-espressif_esp32_zephyr-elf:arm-zephyr-eabi

      # ── ESP-WROVER-KIT (ESP32 / Xtensa LX6) ────────────────────────────

      - name: Build L4 tests — esp_wrover_kit
        working-directory: ${{ github.workspace }}
        run: |
          west build -b esp_wrover_kit/esp32/procpu \
            --build-dir tapestry/tapestry-csm-sim/build/hw-esp-test-csm \
            tapestry/tapestry-csm-sim/tests

      - name: Build L5 tests — esp_wrover_kit
        working-directory: ${{ github.workspace }}
        run: |
          west build -b esp_wrover_kit/esp32/procpu \
            --build-dir tapestry/tapestry-scr-sim/build/hw-esp-test-scr \
            tapestry/tapestry-scr-sim/tests

      # ── Renesas EK-RA8D1 (RA8D1 / Cortex-M85) ──────────────────────────

      - name: Build L4 tests — ek_ra8d1
        working-directory: ${{ github.workspace }}
        run: |
          west build -b ek_ra8d1 \
            --build-dir tapestry/tapestry-csm-sim/build/hw-ra8d1-test-csm \
            tapestry/tapestry-csm-sim/tests

      - name: Build L5 tests — ek_ra8d1
        working-directory: ${{ github.workspace }}
        run: |
          west build -b ek_ra8d1 \
            --build-dir tapestry/tapestry-scr-sim/build/hw-ra8d1-test-scr \
            tapestry/tapestry-scr-sim/tests

      # ── BBC micro:bit V2 (nRF52833 / Cortex-M4F) ────────────────────────
      # Phase 1: verify that the pure C99 L4/L5 core compiles for nRF52833.

      - name: Build L4 tests — bbc_microbit_v2
        working-directory: ${{ github.workspace }}
        run: |
          west build -b bbc_microbit_v2 \
            --build-dir tapestry/tapestry-csm-sim/build/hw-mb-test-csm \
            tapestry/tapestry-csm-sim/tests

      - name: Build L5 tests — bbc_microbit_v2
        working-directory: ${{ github.workspace }}
        run: |
          west build -b bbc_microbit_v2 \
            --build-dir tapestry/tapestry-scr-sim/build/hw-mb-test-scr \
            tapestry/tapestry-scr-sim/tests

      # ── Phase 2 hardware element (tapestry-scr-hw) ──────────────────────
      # WiFi credentials are not needed for a compile-only check; a dummy
      # wifi.conf supplies the required Kconfig strings.
      # The ESP32 WiFi driver requires binary blobs from Espressif.

      - name: Fetch ESP32 WiFi blobs
        working-directory: ${{ github.workspace }}
        run: west blobs fetch hal_espressif

      - name: Build Phase 2 element — esp_wrover_kit
        working-directory: ${{ github.workspace }}
        run: |
          printf 'CONFIG_TAPESTRY_WIFI_SSID="ci"\nCONFIG_TAPESTRY_WIFI_PSK="ci"\n' \
            > /tmp/ci_wifi.conf
          west build -b esp_wrover_kit/esp32/procpu \
            --build-dir tapestry/tapestry-scr-hw/build/hw-esp \
            --extra-conf /tmp/ci_wifi.conf \
            tapestry/tapestry-scr-hw

      - name: Build Phase 2 element — ek_ra8d1
        working-directory: ${{ github.workspace }}
        run: |
          west build -b ek_ra8d1 \
            --build-dir tapestry/tapestry-scr-hw/build/hw-ra8d1 \
            tapestry/tapestry-scr-hw

      # ── BBC micro:bit V2 Phase 2 element ────────────────────────────────
      # Full-stack (L4+L5+L6+L7) element from tapestry-scr-hw.

      - name: Build Phase 2 element — bbc_microbit_v2
        working-directory: ${{ github.workspace }}
        run: |
          west build -b bbc_microbit_v2 \
            --build-dir tapestry/tapestry-scr-hw/build/hw-mb \
            tapestry/tapestry-scr-hw

      # bbc_microbit_v2 is the only Phase 2 target whose board .conf sets
      # CONFIG_BT=y (esp_wrover_kit's BLE leg was dropped when the gossip
      # frame outgrew legacy advertising — see esp_wrover_kit_esp32_procpu
      # .conf), so it's the only build that can compile transceiver_ble.c
      # at all — and the auth/relay CI above only ever links gossip.c
      # against a loopback transceiver, never transceiver_ble.c. That means
      # the BUILD_ASSERT in transceiver_ble.c guarding the extended-
      # advertising payload budget (see that file's comment) had never
      # actually been evaluated by any build in this repo. This is the one
      # place CONFIG_BT=y (+ CONFIG_BT_EXT_ADV=y, set unconditionally in
      # bbc_microbit_v2.conf) and CONFIG_TAPESTRY_WIRE_AUTH_ENABLED=y
      # compile together, so it's what makes that guard real instead of
      # aspirational — and proves the bt_le_ext_adv_* rewrite links at all.
      - name: Build Phase 2 element — bbc_microbit_v2 (auth enabled)
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s\n' \
            'CONFIG_MBEDTLS=y' \
            'CONFIG_MBEDTLS_BUILTIN=y' \
            'CONFIG_MBEDTLS_PSA_CRYPTO_C=y' \
            'CONFIG_PSA_WANT_ALG_HMAC=y' \
            'CONFIG_PSA_WANT_ALG_SHA_256=y' \
            'CONFIG_PSA_WANT_KEY_TYPE_HMAC=y' \
            'CONFIG_MBEDTLS_ENABLE_HEAP=y' \
            'CONFIG_MBEDTLS_HEAP_SIZE=8192' \
            'CONFIG_TAPESTRY_WIRE_AUTH_ENABLED=y' \
            'CONFIG_TAPESTRY_WIRE_AUTH_KEY="tapestry-ci-test-key"' \
            > /tmp/ci_auth.conf
          west build -b bbc_microbit_v2 \
            --build-dir tapestry/tapestry-scr-hw/build/hw-mb-auth \
            --extra-conf /tmp/ci_auth.conf \
            tapestry/tapestry-scr-hw

      # ── cutebot-formation example ─────────────────────────────────────
      # Compile-only (flashing requires physical hardware). Two Kconfig
      # modes (DEMO_MODE choice, see examples/cutebot-formation/Kconfig):
      # DEMO_MODE_CHOREO (default, L5/L6/L7 — unvalidated on real hardware,
      # see that example's README) and DEMO_MODE_SHOWCASE (the original,
      # flight-validated L4-only spring field). Both built here so a
      # regression in either mode is caught, not just whichever is default.

      - name: Build cutebot-formation (DEMO_MODE_CHOREO, default) — bbc_microbit_v2
        working-directory: ${{ github.workspace }}
        run: |
          west build -b bbc_microbit_v2 \
            --build-dir tapestry/examples/cutebot-formation/build/hw-mb \
            tapestry/examples/cutebot-formation

      - name: Build cutebot-formation (DEMO_MODE_SHOWCASE) — bbc_microbit_v2
        working-directory: ${{ github.workspace }}
        run: |
          printf 'CONFIG_DEMO_MODE_SHOWCASE=y\n' > /tmp/ci_showcase.conf
          west build -b bbc_microbit_v2 \
            --build-dir tapestry/examples/cutebot-formation/build/hw-mb-showcase \
            --extra-conf /tmp/ci_showcase.conf \
            tapestry/examples/cutebot-formation

      # ── Crazyflie 2.1 Brushless (STM32F405 / Cortex-M4F) ────────────────
      # Compile-only: the full stabilizer/lighthouse/PM board stack via the
      # three-drone demo, and the L4-L7 runtime element.  The out-of-tree
      # board definition lives in tapestry-scr-hw/boards (each app appends
      # it to BOARD_ROOT itself).  Note: the local Zephyr I2C-v1-RTIO patch
      # (patches/) fixes runtime bugs only — compilation is unaffected.

      - name: Build cf21bl-formation demo — crazyflie21bl
        working-directory: ${{ github.workspace }}
        run: |
          west build -b crazyflie21bl \
            --build-dir tapestry/examples/cf21bl-formation/build/hw-cf21bl \
            tapestry/examples/cf21bl-formation

      - name: Build Phase 2 element — crazyflie21bl
        working-directory: ${{ github.workspace }}
        run: |
          west build -b crazyflie21bl \
            --build-dir tapestry/tapestry-scr-hw/build/hw-cf21bl \
            tapestry/tapestry-scr-hw

  # ── webots-formation (plain host C, no Zephyr) ────────────────────────
  # This is not a Zephyr/west build (see examples/webots-formation/README.md's
  # "Architecture" section) and the real Makefile needs an actual Webots
  # install (~1 GB) for its headers and libcontroller — too heavy to ask of
  # every CI run. examples/webots-formation/ci-check/ compiles and links the
  # same L3-L7 core sources (pulled in unmodified from controllers/cf21bl/
  # and controllers/common/) against header stubs for the ~10 Webots device
  # calls this controller actually makes, catching compile/link breakage
  # without installing Webots; it never runs the resulting binary. Building
  # against the real SDK before trusting a change to the Webots device calls
  # themselves is still on you — see ci-check/Makefile's own comment.
  webots-formation:
    name: webots-formation compile check (header stubs, no Webots install)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Tapestry
        uses: actions/checkout@v7
        with:
          path: tapestry

      - name: Build cf21bl controller against Webots header stubs
        working-directory: tapestry/examples/webots-formation/ci-check
        run: make
