# Board config for Crazyflie 2.1 brushless (STM32F405 / Cortex-M4F)
# Running L5 SCR (Swarm Coordination Runtime) unit tests directly on hardware.
#
# Build:
#   west build -p always -b crazyflie21bl tapestry/tapestry-scr-sim/tests
# Flash:
#   cfloader flash build/zephyr/zephyr.bin stm32-dfu
# Read results:
#   python3 tapestry/tapestry-os/tools/crazyflie_console.py
#
# Test output (ztest PASS/FAIL + LOG_* messages) travels via:
#   STM32 → cf21bl_crtp_log.c → USART6 (1 Mbps) → nRF51 factory firmware
#   → 2.4 GHz radio → crazyradio2 → crazyflie_console.py on host.
#
# CONFIG_LOG_PRINTK routes ztest's printk output through the log subsystem
# so it also appears in the CRTP console stream.
# CONFIG_LOG_MODE_IMMEDIATE flushes each message synchronously — output is
# preserved even if the test binary crashes immediately after a failure.

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Larger stacks: SCR tests allocate world_model_t + scr_state_t on the stack.
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
