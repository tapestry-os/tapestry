# Board overlay for the Ambiq Apollo510 EVB (Cortex-M55)
#
# The apollo5x SoC Kconfig selects CPU_HAS_FPU but leaves CONFIG_FPU off, so
# unlike the RA8D1 overlay it has to be set explicitly here.  Stack sizes are
# bumped from the 1 KiB ztest default for the same reason as the ESP32 and
# RA8D1 overlays: test functions allocate world_model_t structs on the stack.
CONFIG_FPU=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
