# west-ambiq.yml — Tapestry against Ambiq's Zephyr distribution
#
# Identical to west.yml except that Zephyr comes from AmbiqMicro/ambiqzephyr
# instead of upstream.  That distribution carries board and SoC support that has
# not reached upstream yet — notably apollo330mP_evb (Apollo330M Plus), which
# Tapestry supports as a wired-bus and BLE element.
#
# Use it for a separate workspace rather than converting your upstream one:
#
#   west init -m https://github.com/tapestry-os/tapestry \
#             --mf west-ambiq.yml tapestry-ambiq-workspace
#   cd tapestry-ambiq-workspace && west update && west zephyr-export
#
# Keeping the two workspaces apart matters: the boards validated on upstream
# Zephyr (crazyflie21bl, bbc_microbit_v2, ek_ra8d1, esp_wrover_kit,
# apollo510_evb) stay on the tree they were validated against, and Ambiq-only
# work does not drag every other target onto a vendor fork.
#
# `ambiq-stable` is Ambiq's manufacturing and customer release line.  Pin it to
# a tag or SHA for anything reproducible — a moving branch is fine for bring-up
# and wrong for a release.

manifest:
  self:
    path: tapestry

  remotes:
    - name: ambiq
      url-base: https://github.com/AmbiqMicro

  projects:
    - name: zephyr
      remote: ambiq
      repo-path: ambiqzephyr
      revision: ambiq-stable
      import: true   # pulls in Ambiq's manifest (their hal_ambiq fork, etc.)
