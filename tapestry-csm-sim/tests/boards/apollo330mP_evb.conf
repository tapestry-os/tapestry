# Board overlay for the Ambiq Apollo330M Plus EVB (Cortex-M55)
#
# CONFIG_FPU is set explicitly for the same reason as the Apollo510 overlay:
# the apollo3xx SoC Kconfig selects CPU_HAS_FPU but leaves CONFIG_FPU off.
# Stack sizes are bumped from the 1 KiB ztest default because test functions
# allocate world_model_t structs on the stack.
CONFIG_FPU=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
