CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_PRINTK=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Motor ESCs
CONFIG_PWM=y

# IMU (gyro + accel for attitude control)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y
CONFIG_SENSOR_ASYNC_API=y

# Barometer (BMP390 at I2C3 0x77) — drives CONFIG_CF21BL_ALTITUDE_HOLD below
CONFIG_BMP388=y

# Stabilizer: rate + angle loop + baro altitude hold (2026-07-06: switched
# from this example's old hand-rolled lighthouse-Z PID to the already
# flight-validated closed-loop altitude hold, to isolate a horizontal
# instability from possible Z coupling — see src/main.c header)
CONFIG_CF21BL_STABILIZER=y
CONFIG_CF21BL_ANGLE_MODE=y
CONFIG_CF21BL_ALTITUDE_HOLD=y

# Yaw heading hold (Stage D): lock heading to boot orientation so the
# world-frame position corrections stay aligned with the body axes
CONFIG_CF21BL_YAW_HOLD=y

# Battery telemetry + thrust compensation (keeps the liftoff feedforward
# valid as the pack sags) + critical-battery forced landing
CONFIG_CF21BL_PM=y

# Lighthouse: X/Y position hold via the stabilizer; Z is baro (above), not lighthouse
CONFIG_CF21BL_LIGHTHOUSE=y
CONFIG_CF21BL_LIGHTHOUSE_POS_HOLD=y
CONFIG_CF21BL_POS_MAX_M=3
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ESC protocol: OneShot125 (validated on tether 2026-07-03; delete to fall back to RC PWM 400 Hz)
CONFIG_CF21BL_ESC_ONESHOT125=y
