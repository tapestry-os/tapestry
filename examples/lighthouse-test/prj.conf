CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# Suppress driver init noise (I2C, UART) that would otherwise flood the buffer
CONFIG_I2C_LOG_LEVEL_WRN=y
CONFIG_UART_LOG_LEVEL_WRN=y
CONFIG_PRINTK=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Lighthouse UART data (USART3 PC10/PC11)
# I2C boot removed: green LED on deck confirms FPGA auto-boots from SPI flash
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CF21BL_LIGHTHOUSE=y

# Console: USART3 is taken by the lighthouse deck at 230400 baud.
# Use the CRTP radio console (crazyflie_console.py via crazyradio2).
# The nRF51 CRTP log backend (cf21bl_crtp_log.c) routes LOG_* over radio.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
