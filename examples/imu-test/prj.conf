CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y

# Zephyr 4.4.0-rc1 bmi08x driver bug workaround: BMI08X_CREATE_INST always
# initializes .rtio_bus, but that struct field only exists when
# CONFIG_SENSOR_ASYNC_API is set — without this the driver fails to compile.
CONFIG_SENSOR_ASYNC_API=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
