# USART3 taken by the lighthouse deck at 230400 baud (see the
# crazyflie21bl_lh.overlay fragment) — no wired console available.
# USART6 is shared by the syslink P2P transceiver, the CRTP console backend,
# and (if CONFIG_CF21BL_PM=y) battery telemetry, serialized by
# cf21bl_syslink_tx_mutex.
# Read: python3 tapestry/tapestry-os/tools/crazyflie_console.py
# Disable motors: west build ... -- -DCONFIG_PWM=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_I2C_LOG_LEVEL_WRN=y
CONFIG_UART_LOG_LEVEL_WRN=y
