CONFIG_ZTEST=y

# Without this, every %f/%e/%g conversion in a LOG_* call or a zassert_*
# failure message (both go through the same cbprintf formatter) prints
# the literal conversion specifier instead of the value — e.g.
# "separation dipped to %.2f m" instead of the actual number. Every
# assertion message and LOG_DBG line in this suite uses %f formatting.
CONFIG_CBPRINTF_FP_SUPPORT=y

# formation.c's LOG_DBG lines (demo_compute_drive, demo_choreo_track) fire
# every simulated tick — one of the swap-script tests alone runs ~300
# ticks, so DBG defaulting on floods the console with thousands of lines
# and buries the one ztest PASS/FAIL summary that actually matters.
# Matches the flight build's own examples/cf21bl-formation/prj.conf,
# which sets the same level for the same reason.
CONFIG_LOG_DEFAULT_LEVEL=3
