# change-partners.choreo.toml — the "change-partners" show, and the ONLY
# file to edit to change it.  Regenerate the committed header afterwards:
#
#   python3 tapestry/sdk/tools/choreoc.py \
#       tapestry/examples/cf21bl-formation/change-partners.choreo.toml
#
# The script is deliberately coordinate-free: hold references each drone's
# own current station, exchange references its partner's.  There is no
# "take off", no "land", and no altitude anywhere below — script completion
# means quiescence, which this platform maps to landing in place; altitude
# staggering is a platform deconfliction rule the Choreo never sees.

choreo = "change-partners"

# Stay at the current stations.
[[steps]]
hold = { duration = "10s", requires = ["locomotion"] }

# Swap places: each drone takes its partner's station (stations are frozen
# snapshots at step start).  path="direct" beelines straight over — safe on
# this platform because deconfliction is VERTICAL (ID-staggered altitudes),
# and much faster than the default centroid arc (~4 s vs ~21 s for a 1 m
# swap).  Keep the default arc on platforms with no vertical dimension.
# Advances once BOTH drones have settled within eps of their own
# destination for the settle time (scope="all" — the achieved-bit is
# gossiped and aggregated, see choreo_collective_achieved()); the timeout
# is the robustness net if achievement never fires on one side. scope="all"
# is also what keeps the first-finisher airborne and gossiping until its
# partner catches up: its own exchange step won't advance (so it won't
# suspend/stop gossiping) until the collective predicate is true.
[[steps]]
[steps.exchange]
until    = "achieved"
scope    = "all"
timeout  = "30s"
path     = "direct"
eps      = "25cm"
settle   = "3s"
requires = ["locomotion"]

# Bow: a deliberate settle beat on the new stations before landing. NOT a
# sync workaround anymore — scope="all" above already guarantees neither
# drone reaches this step until both have swapped, so this is purely a
# short hover-together beat before quiescence.
[[steps]]
hold = { duration = "8s", requires = ["locomotion"] }
