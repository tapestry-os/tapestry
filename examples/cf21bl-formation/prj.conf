CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Motor ESCs
CONFIG_PWM=y

# IMU (BMI088 over I2C3, required by CF21BL_STABILIZER)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y
CONFIG_SENSOR_ASYNC_API=y

# Barometer (BMP390 at I2C3 0x77; CONFIG_BMP388 covers both chips) — Z control
CONFIG_BMP388=y

# Stabilizer layers
CONFIG_CF21BL_STABILIZER=y
CONFIG_CF21BL_ANGLE_MODE=y
CONFIG_CF21BL_ALTITUDE_HOLD=y

# Heading lock — world-frame XY corrections below assume boot-orientation
# yaw stays fixed (see lh2-hover's placement-requirement note).
CONFIG_CF21BL_YAW_HOLD=y

# Lighthouse: X/Y position hold (replaces dead-reckoning odometry).  Each
# drone's real absolute position is gossiped instead of an integrated
# estimate — see formation.h for the shared-calibration requirement.
# POS_MAX_M=3 matches lh2-hover's validated setting for this room.
CONFIG_CF21BL_LIGHTHOUSE=y
CONFIG_CF21BL_LIGHTHOUSE_POS_HOLD=y
CONFIG_CF21BL_POS_MAX_M=3
CONFIG_SERIAL=y

# Battery telemetry + forced landing on critical voltage — independent per
# drone (cf21bl_stabilizer.c's PM-critical path), does not depend on peers.
CONFIG_CF21BL_PM=y

# Syslink P2P transceiver (requires interrupt-driven UART for RX ISR on
# USART6; also drives the lighthouse deck's USART3 and, if CONFIG_LOG=y,
# the CRTP console — all interrupt-driven UARTs share this one option).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_TAPESTRY_TRANSCEIVER_SYSLINK=y
CONFIG_TAPESTRY_P2P_CHANNEL=80

# L4 world model
# Override per drone: west build ... -- -DCONFIG_TAPESTRY_ELEMENT_ID=1
CONFIG_TAPESTRY_ELEMENT_ID=0
CONFIG_TAPESTRY_AUTO_ID_WINDOW_MS=4000

# ESC protocol: OneShot125 (validated on tether 2026-07-03; delete to fall back to RC PWM 400 Hz)
CONFIG_CF21BL_ESC_ONESHOT125=y
