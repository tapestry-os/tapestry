# Tapestry BLE observer, application core.  The controller runs on the
# network core; see sysbuild/hci_ipc/prj.conf.

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_SCAN_BUF_SIZE=255

# Advertising reports arrive in the host's DISCARDABLE event pool.  Its
# default buffer (58 bytes with extended advertising) is smaller than an
# extended report carrying a gossip frame (~84 bytes), and its default
# depth (3) overflows under four robots.
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=16
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255

CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# The serial port carries only the observer's own lines: logging would
# interleave bytes into them from another thread.
CONFIG_LOG=n
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_GPIO=y
