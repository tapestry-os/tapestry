# Network-core controller for the Tapestry BLE observer: scan only,
# legacy + extended advertising.  Replaces samples/bluetooth/hci_ipc's
# prj.conf (see ../../sysbuild.cmake).

CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_LL_SW_SPLIT=y

CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y

# The controller reassembles at most this many bytes of extended
# advertising data per report.  The default (31) truncates or drops every
# gossip PDU (3 + 49 + 4-byte tag = 56 bytes of manufacturer data).  255
# leaves room for the frame to grow toward wire.h's 200-byte single-PDU
# ceiling.
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=255

# Auxiliary-channel scan contexts: how many AUX_ADV_IND PDUs the scanner
# can follow at once.  The default (1) loses a robot's extended PDU
# whenever another robot's is already being followed.  Lives in the
# controller's "Advanced features" menu, which is invisible (so the value
# silently stays 1) unless BT_CTLR_ADVANCED_FEATURES is set.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_SCAN_AUX_SET=8

# Headroom for bursts of reports queued toward the app core.
CONFIG_BT_CTLR_RX_BUFFERS=12
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
