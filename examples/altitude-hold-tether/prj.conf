CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Motor ESCs
CONFIG_PWM=y

# IMU (required by CF21BL_STABILIZER)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y
CONFIG_SENSOR_ASYNC_API=y

# Barometer (BMP390 at 0x77; CONFIG_BMP388 covers both BMP388 and BMP390)
CONFIG_BMP388=y

# Stabilizer: rate + angle + closed-loop altitude hold (WS3 cascade)
CONFIG_CF21BL_STABILIZER=y
CONFIG_CF21BL_ANGLE_MODE=y
CONFIG_CF21BL_ALTITUDE_HOLD=y

# Battery telemetry from the nRF51 over syslink (USART6) + thrust
# compensation + critical-battery forced landing.  Set =n to isolate the
# Stage A motor-mapping changes during validation.
CONFIG_CF21BL_PM=y
CONFIG_UART_INTERRUPT_DRIVEN=y
