# Board overlay for BBC micro:bit V2 (nRF52833 / Cortex-M4F)
# BLE gossip transport + Cutebot Mini motor and LED output.

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── Bluetooth ─────────────────────────────────────────────────────────────────
# CONFIG_BT_EXT_ADV: required since the gossip frame (wire.h v3, 42 bytes)
# no longer fits legacy advertising's 31-byte payload — see
# transceiver_ble.c's header comment.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y

# CONFIG_BT_EXT_ADV (host) and CONFIG_BT_CTLR_ADV_EXT (controller, which it
# pulls in by default) only enable the extended-advertising FEATURE — the
# controller's advertising/scan BUFFERS are separate knobs and both default
# to 31, the legacy payload size.  Left at the default the controller answers
# LE Read Max Adv Data Len with 31, the host enforces that, and every
# bt_le_ext_adv_set_data() fails -EDOM: the advertiser starts cleanly and then
# never transmits a frame, so every element sees zero peers (red headlights,
# no motion — 2026-08-24 first hardware run).  64 covers the 48 bytes the
# wire.h v3 frame needs (42-byte frame + company ID + msg type + AD headers)
# with headroom for another wire-format growth.  SCAN_DATA_LEN_MAX must rise
# with it or elements can send what they cannot receive.
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=64
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=64
CONFIG_BT_DEVICE_NAME="tapestry-cutebot-formation"
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── I2C (Cutebot) ─────────────────────────────────────────────────────────────
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# ── micro:bit LED matrix ───────────────────────────────────────────────────────
# MICROBIT_DISPLAY (mb_display_get / mb_display_image) depends on DISPLAY.
CONFIG_DISPLAY=y
CONFIG_MICROBIT_DISPLAY=y
