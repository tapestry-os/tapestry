# leak.choreo.toml — "find the leak, cordon it": four robots search the
# arena for the IR-dark marker (king's printed disc).  The finder stops and
# holds while its peers hear where it is; then ALL FOUR, finder included,
# form a circle around that spot.  Power one robot off and the other three
# re-balance into an equilateral triangle around the same spot.
#
#   python3 tapestry/sdk/tools/choreoc.py \
#       tapestry/examples/cutebot-formation/leak.choreo.toml \
#       -o tapestry/examples/cutebot-formation/src/choreo_script.h
#
# Units are this app's abstract [0, WORLD_SIZE] world, same as the others.
#
# How it differs from king.choreo.toml:
#   - No [[tracks]]: the finder does not move to an "anchor" track, so
#     bse.c's collect_participants() counts it — four vertices, not three.
#   - The ring anchors on { select = "discovery-point" }, not "discoverer":
#     the POSITION the finder gossiped with its discovered bit, latched by
#     every robot the first tick it sees that bit and never moved again.
#     "discoverer" would follow the finder as it backs out to its own slot
#     (the circle would chase its own member) and would lose its centre if
#     the finder is the robot taken away.
#   - "found" is a short HOLD everyone enters on discovery_any.  It keeps
#     the finder parked on the marker until its peers have heard it — a
#     peer that first hears the bit after the finder has moved would latch
#     the wrong spot.  main.c releases the finder's stop-on-discovery once
#     the script leaves the step it discovered on
#     (CHOREO_USES_DISCOVERY_POINT, emitted by choreoc for this anchor).
#   - One finder, as king: once any peer's bit is visible a robot ignores
#     its own dark hits (DEMO_DISCOVERY_SINGLE_FINDER), so robots driving
#     over the marker while forming the ring do not re-discover it.
#
# Removing a robot: switch it OFF.  Lifting it is not removal — it keeps
# gossiping, and a lifted sensor reads dark.  The survivors notice after
# the world model's stale threshold (3 s) plus Choreo's membership hold
# (3 s), fire element_lost, and re-form the ring with count 3.
#
# Geometry (DEMO_TRACK_MIN_SEP = 25.3 units): radius 20 puts four robots
# 28.3 units apart and three 34.6 units apart, both clear of it.  The
# latched point is where the finder's line sensors confirmed dark — the
# disc's near edge, not its centre — so the circle sits up to about half a
# disc (~5 units) off the marker's middle.
#
# PLACEMENT: 2 to 3.5 squares from the centre (radius 15-35 units), in
# any direction. Inside 1.5 squares the robots only cross on their way
# out; beyond 3.5 the ring around the find would leave the arena.
#
# Search: an outward spiral, symmetric by construction. Each "leg" is a
# FORM circle about the board centre, 1/18 of a turn (20 degrees) further
# round and ~0.8 units larger than the last (rotation 45 -> 405 degrees,
# radius 22 -> 37), so each robot walks its own spiral arm, 90 degrees
# from its neighbours, turning ~20 degrees per leg. Every point at the
# same distance from the centre is reached at the same time — the old
# translated-circle patrol found (30,30) first and (70,70) late. Host
# coverage check (112 marker spots): worst 19 s, mean 4.4 s, the four
# diagonals at 1.6 s.
#
# Legs are TIMED (duration), not "until achieved": every robot moves to
# the next angle on the same clock (they start the script together after
# the peer barrier), so the four stay 90 degrees apart. With per-robot
# "achieved" legs a quick robot ran up to ~3 legs ahead in simulation,
# bringing neighbours within ~11 units. A robot that falls behind just
# chases its moving vertex. Leg 1 (out from the start cross) gets 3 s, the
# rest 1.5 s: ~30 s for the whole spiral. Radius starts at 22 so
# neighbours 90 degrees apart are ~31 units apart, clear of
# DEMO_TRACK_MIN_SEP (25.3).

choreo      = "leak"
max_runtime = "15min"

[[steps]]
name = "leg1"
[steps.form]
shape    = "circle"
target   = [50.0, 50.0, 0.0]
radius   = 22.00
rotation = "45deg"
duration = "3s"
requires = ["locomotion", "abs_position"]
on       = [ { event = "discovery_any", goto = "found" } ]

