# Wireless debug telemetry for untethered runs — see Kconfig's
# DEMO_BLE_DEBUG and src/ble_debug.h.  Build with:
#   west build ... -- -DEXTRA_CONF_FILE=ble_debug.conf
CONFIG_DEMO_BLE_DEBUG=y
# Gossip's extended set + the shared-fact set + the debug set's legacy one.
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
