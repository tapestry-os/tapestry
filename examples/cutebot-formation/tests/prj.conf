CONFIG_ZTEST=y

# Without this, every %f/%e/%g conversion in a LOG_* call or a zassert_*
# failure message (both go through the same cbprintf formatter) prints
# the literal conversion specifier instead of the value. Same rationale as
# cf21bl-formation/tests/prj.conf, which this file mirrors.
CONFIG_CBPRINTF_FP_SUPPORT=y

# formation.c's LOG_DBG lines fire every simulated tick — the FORM script
# test alone runs hundreds of ticks; DBG defaulting on floods the console
# and buries the ztest PASS/FAIL summary. Matches the robot build's own
# examples/cutebot-formation/prj.conf, which sets the same level.
CONFIG_LOG_DEFAULT_LEVEL=3
