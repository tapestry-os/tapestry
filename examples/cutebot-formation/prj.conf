# ── Stack / heap ──────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=8192

# ── Hardware info (FICR device ID — used for auto element-ID assignment) ──────
CONFIG_HWINFO=y

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# ── Identity ──────────────────────────────────────────────────────────────────
# One binary for all robots — IDs negotiated at boot over BLE. 8 s window
# (vs the 4 s transport.c default): was previously set via a CMakeLists.txt
# target_compile_definitions override "without touching Kconfig" — moved
# here now that this app's own Kconfig (added alongside L5/L6/L7 wiring)
# rsources tapestry-os/subsys/transport/Kconfig, which already declares
# this option; setting both would double-define the macro.
CONFIG_TAPESTRY_AUTO_ID_WINDOW_MS=8000

# Board-specific configs (BLE, I2C) live in boards/bbc_microbit_v2.conf.
