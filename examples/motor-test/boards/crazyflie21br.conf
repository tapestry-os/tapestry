CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PWM=y

# IMU (BMI088 over I2C3)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y
CONFIG_SENSOR_ASYNC_API=y   # Zephyr 4.4.0-rc1 bmi08x driver bug workaround

# Stabilizer (rate loop)
CONFIG_CF21_STABILIZER=y

# Log
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

CONFIG_CF21_HOVER_TEST=y
CONFIG_CF21_ANGLE_MODE=y
CONFIG_CF21_HOVER_THROTTLE_PCT=55