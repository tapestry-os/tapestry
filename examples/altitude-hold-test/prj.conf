CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Motor ESCs
CONFIG_PWM=y

# IMU (required by CF21BL_STABILIZER)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y
CONFIG_SENSOR_ASYNC_API=y

# Barometer (BMP390 at 0x77; CONFIG_BMP388 covers both BMP388 and BMP390)
CONFIG_BMP388=y

# Stabilizer layers
CONFIG_CF21BL_STABILIZER=y
CONFIG_CF21BL_ANGLE_MODE=y
# Altitude hold PID disabled deliberately: this test drives collective
# open-loop (ramp up / detect liftoff / ramp down) and reads the BMP390
# directly itself instead of letting the stabilizer's Z-PID reinterpret
# linear.z as a closed-loop altitude setpoint.
# CONFIG_CF21BL_ALTITUDE_HOLD is not set

# Lighthouse positioning (observation only — no position hold)
CONFIG_CF21BL_LIGHTHOUSE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
