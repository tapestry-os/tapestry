CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PRINTK=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Motor ESCs (never armed by this app — see src/main.c)
CONFIG_PWM=y

# IMU (required by CF21BL_STABILIZER)
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_BMI08X=y
CONFIG_BMI08X_GYRO_TRIGGER_OWN_THREAD=y
CONFIG_SENSOR_ASYNC_API=y

# Barometer (BMP390 at 0x77; CONFIG_BMP388 covers both BMP388 and BMP390)
CONFIG_BMP388=y

# Stabilizer: rate + angle + altitude hold, exercising the full WS3 path
CONFIG_CF21BL_STABILIZER=y
CONFIG_CF21BL_ANGLE_MODE=y
CONFIG_CF21BL_ALTITUDE_HOLD=y

# ESC protocol: OneShot125 (validated on tether 2026-07-03; delete to fall back to RC PWM 400 Hz)
CONFIG_CF21BL_ESC_ONESHOT125=y
