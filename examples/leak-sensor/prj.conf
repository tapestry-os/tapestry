# ── Stack / heap ──────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=8192

# ── Floating point ────────────────────────────────────────────────────────────
CONFIG_FPU=y

# ── Logging ───────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# ── Buttons and LEDs (devicetree aliases sw0/sw1, led0..led2) ─────────────────
CONFIG_GPIO=y

# Board-specific configs (BLE) live in boards/<board>.conf.
