# Ambiq Apollo330M Plus EVB (Apollo330P / Cortex-M55) — BLE only.
#
# The on-die BLE controller is reached over HCI IPC (zephyr,bt-hci in the
# board DTS). Same BLE settings as tapestry-scr-hw/boards/apollo330mP_evb.conf,
# without the wired serial bus. Builds in the Ambiq workspace — see
# tapestry-os/boards/apollo330mP_evb/README.md.

CONFIG_FPU_SHARING=y

# ── Gossip transport: BLE ─────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
# The robots advertise the gossip frame with extended advertising; the
# scanner only receives those reports with this on.
CONFIG_BT_EXT_ADV=y
# Two advertising sets: state gossip and shared facts (transceiver_ble.c).
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_DEVICE_NAME="tapestry-leak-sensor"
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
